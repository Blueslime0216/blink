<!DOCTYPE html>
<html>
  <head>
    <style>
      .margineTopEmpty0 {
        height: 0px;
        margin-top: -58px;
        /* border: 1px solid rgb(255, 0, 0); */
      }
      .margineTopEmpty {
        height: calc((100vh - 530px)/2);
        /* border: 1px solid rgb(0, 255, 0); */
      }
      .justLineGab {
        height: 25px;
      }
      .justLine {
        width: 250px;
        height: 0px;
        border: 3px solid rgb(7, 13, 14);
        border-left: 0px;
        border-right: 0px;
      }
      .justLine2 {
        width: 250px;
        height: 0px;
        border: 2px solid rgb(52, 91, 99);
        border-left: 0px;
        border-right: 0px;
      }
      .outLine {
        width: 250px;
        height: 477px;
        margin: auto;
        margin-top: -100;
        background-color: rgb(17, 32, 49);
        border: 5px outset rgb(52, 91, 99);
        border-radius: 10px;
        border-top-right-radius: 0px;
        position: relative;
        z-index: 10;
      }
      #cycleTime {
        width: 200px;
        height: 100px;
        margin-top: 25px;
        margin-left: calc(50% - 105px);
        border: 5px inset rgb(52, 91, 99);
        background-color: rgb(21, 29, 37);
        color: rgb(52, 91, 99);
        border-radius: 10px;
        font-size: 50px;
      }
      button {
        width: 210px;
        height: 100px;
        margin-top: 50px;
        margin-left: calc(50% - 105px);
        border: 5px outset rgb(52, 91, 99);
        background-color: rgb(17, 32, 49);
        color: rgb(52, 91, 99);
        border-radius: 10px;
        font-size: 46px;
        transition: 0.4s;
        font-family: Tahoma, sans-serif;
      }
      #btn {
        font-family: Helvetica, sans-serif;
        font-size: 50px;
      }
      button:hover{
            background-color: rgb(40, 55, 71);
      }
      #importAudio {
        height: 130px;
        margin-top: 25px;
      }
      #importAudio:hover {
            background-color: rgb(40, 55, 71);
      }
      #helpBtn {
        transform: rotate(90deg) translate(-409px, 25px);
        width: 100px;
        height: 40px;
        font-size: 20px;
        font-weight: 600;
        font-family: Tahoma, sans-serif;
        color: rgba(52, 91, 99, 0);
        border-bottom: 0px solid rgb(52, 91, 99);
        border-bottom-left-radius: 0px;
        border-bottom-right-radius: 0px;
        margin-top: -40px;
        margin-left: calc(50% + 100px);
        transition: 0.2s;
        position: relative;
        z-index: 2;
      }
      #helpBtn:hover {
        color: rgb(52, 91, 99);
        transform: rotate(90deg) translate(-409px, 0px);
        height: 40px;
      }
      .sighLayer1 {
        width: 50px;
        height: 50px;
        background-color: rgb(17, 32, 49);;
        border: 5px outset rgb(52, 91, 99);
        border-bottom: 0px solid rgb(52, 91, 99);
        border-radius: 5px;
        border-bottom-left-radius: 0px;
        border-bottom-right-radius: 0px;
        margin-top: 0px;
        margin-left: calc(50% + 62px);
        transform: translate(8px, 5px);
        position: relative;
        z-index: 11;
      }
      .sighLayer2 {
        width: 36px;
        height: 36px;
        background-color: rgb(17, 32, 49);
        border: 7px solid rgb(17, 32, 49);
        position: relative;
        z-index: 12;
      }
      .sigh {
        width: 26px;
        height: 26px;
        background-color: rgb(70, 10, 10);
        border: 5px inset rgb(52, 91, 99);
        position: relative;
        z-index: 13;
        transition: background-color 0.2s;
      }
      #infoImageContainer {
        display: none;
        position: absolute;
        z-index: 100;
        margin-left: calc(50% + 30px);
        transform: translate(-290px, -35px) scale(0.9, 0.9) rotate(0deg);
      }
      #labelSecond {
        width: 60px;
        margin-left: calc(50% + 30px);
        transform: translate(10px, 200px);
        color: rgb(52, 91, 99);
        font-weight: 600;
        position: relative;
        z-index: 19;
      }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body style="background-color: rgb(17, 32, 49);">
    <div class="margineTopEmpty0"></div>
    <div class="margineTopEmpty"></div>
    <div id="infoImageContainer">
      <img id="infoImage" src="https://media.discordapp.net/attachments/1072378822214828164/1073163943129915492/blink_info.png?width=500&height=700">
    </div>
    <p id="labelSecond" onselectstart='return false'>Second</p>
    <div class="sighLayer1">
      <div class="sighLayer2">
        <div class="sigh"></div>
      </div>
    </div>
    <div class="outLine">
      <input type="text" id="cycleTime" value="60" style="text-align: center;" placeholder="[  ● ●] ?">
      <div class="justLineGab"></div>
      <div class="justLine"></div>
      <div class="justLine2"></div>
      <button id="btn" style="margin-top: 25px;">START</button>
      <button id="importAudio">Import Audio</button>
    </div>
    <button id="helpBtn">INFO</button>
    <input type="file" id="fileInput" accept="audio/*" style="display: none; margin-top: -300px;">
    <audio id="sound">
      <source src="https://cdn.discordapp.com/attachments/1072378822214828164/1072449052773457930/beep.wav" type="audio/wav">
    </audio>
    <script>
      var cycleTime = document.querySelector("#cycleTime").value;
      var sound = document.querySelector("#sound");
      var btn = document.querySelector("#btn");
      var intervalId;

      var fileInput = document.querySelector("#fileInput");
      var importAudio = document.querySelector("#importAudio");
      importAudio.addEventListener("click", function() {
        fileInput.click();
      });
      fileInput.addEventListener("change", function() {
        var file = fileInput.files[0];
        var fileURL = URL.createObjectURL(file);
        sound.src = fileURL;
      });

      document.getElementById("helpBtn").addEventListener("click", function() {
        document.getElementById("infoImageContainer").style.display = "block";
        // document.getElementById("infoImageContainer").style.transform = "translate(-170px, 60px) scale(1.1, 1.1) rotate(2deg)";
      });
      document.getElementById("infoImage").addEventListener("click", function() {
        // document.getElementById("infoImageContainer").transform = "translate(0, 0) scale(1, 1) rotate(0)";
        document.getElementById("infoImageContainer").style.display = "none";
      });

      btn.addEventListener("click", function() {
        if (btn.innerHTML === "START") {
          var cycleTimeValue = document.getElementById("cycleTime").value;
          if (!/^[0-9.]+$/.test(cycleTimeValue)) {
            if (cycleTime.value === "") {
              alert("[  ● ●] ?");
            } else {
              alert("숫자를 입력해 주세요");
            }
          } else {
            cycleTime = document.querySelector("#cycleTime").value;
            btn.innerHTML = "STOP";
            document.querySelector("#btn").style.border = "5px inset rgb(52, 91, 99)";
            document.getElementsByClassName("sigh")[0].style.transition = `background-color 0.2s`;
            document.getElementsByClassName("sigh")[0].style.background = "rgb(17, 184, 39)";
            sound.play();
            sound.addEventListener("ended", function() {
              if (btn.innerHTML === "STOP") {
                document.getElementsByClassName("sigh")[0].style.transition = `background-color 1s`;
                document.getElementsByClassName("sigh")[0].style.background = "rgb(10, 70, 18)";
              }
            });
            intervalId = setInterval(function() {
              sound.currentTime = 0;
              sound.play();
              document.getElementsByClassName("sigh")[0].style.transition = `background-color 0.2s`;
              document.getElementsByClassName("sigh")[0].style.background = "rgb(17, 184, 39)";
              sound.addEventListener("ended", function() {
                if (btn.innerHTML === "STOP") {
                  document.getElementsByClassName("sigh")[0].style.transition = `background-color 1s`;
                  document.getElementsByClassName("sigh")[0].style.background = "rgb(10, 70, 18)";
                }
              });
            }, cycleTime * 1000);
            }
        } else {
          clearInterval(intervalId);
          btn.innerHTML = "START";
          document.querySelector("#btn").style.border = "5px outset rgb(52, 91, 99)";
          document.getElementsByClassName("sigh")[0].style.transition = `background-color 2s`
          document.getElementsByClassName("sigh")[0].style.background = "rgb(70, 10, 10)";
        }
      });
    </script>
  </body>
</html>
